services:
  beyhunter:
    build: .
    image: beyhunter:latest
    container_name: beyhunter
    restart: unless-stopped
    ports:
      - "8100:3000"   # NAS 已用咗 5000/5001/8080/443，改行 8100；要改就改呢個冒號前面嘅數字
    env_file:
      - .env
    environment:
      # 冇呢個，V8 會用成部 NAS 嘅 RAM 嚟定 heap 上限，好耐先做一次 major GC，
      # RSS 淨係升唔跌（見過起咗成日爬到 3.4GB）。夾實個 heap，佢會勤啲 GC，
      # RSS 先企得喺合理水平——呢個先係真正止血嘅設定，下面 mem_limit 淨係安全網。
      NODE_OPTIONS: "--max-old-space-size=768"
    # 安全網：就算真係有 leak 都唔會食晒成部 NAS 嘅 RAM。3g 留咗好多 buffer
    # 俾兩個常駐 Chromium（WhatsApp + Playwright，一齊都係 ~0.9GB）＋ Node heap
    # 一齊起跳嗰陣唔會誤 OOM——夾太緊會不斷 crash-loop，好過原本冇上限。
    mem_limit: 3g
    memswap_limit: 3g   # 同 mem_limit 一樣＝唔俾用 swap，爆咗即刻 OOM-kill+restart，好過拖到成部 NAS 一齊 swap thrashing
    volumes:
      - beyhunter-data:/app/data   # SQLite DB + WhatsApp 登入 session，唔會因為重起容器而冇咗
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/feed').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 60s 唔係 20s：NAS 個 btrfs 慢，開機要載 60MB SQLite + WAL（Node 會喺
      # D state 卡一陣），20s 實去唔切 → 頭幾次 probe 一定 fail → 誤報 unhealthy，
      # 連 deploy.sh 都會跟住報部署失敗（其實個 app 冇事）。
      start_period: 60s

volumes:
  beyhunter-data:
